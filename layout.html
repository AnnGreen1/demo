<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }
      body,
      html,
      .container {
        height: 100vh;
        box-sizing: border-box;
        text-align: center;
        overflow: hidden;
      }
      .content {
        background-color: #52c41a;
        /* * 中间部门的布局可以参考 两列 三列 布局 */
        display: grid;
        grid-template-columns: auto 1fr;
      }
      .left {
        width: 240px;
        background-color: #52c41a;
        font-size: 80px;
        line-height: calc(100vh - 100px);
      }
      .right {
        background-color: #f759ab;
        font-size: 60px;
      }
      .header {
        height: 100px;
        background-color: #70a1ff;
      }
      /* .footer {
        height: 100px;
        background-color: #ff7a45;
      } */
      .header,
      .footer {
        line-height: 100px;
        font-size: 52px;
      }

      .content {
        overflow: hidden;
        /* 通过 calc 计算容器的高度 */
        height: calc(100vh - 200px);
      }
      .left {
        height: 100%;
      }
      .right {
        /* 如果超出出现滚动条 */
        overflow: auto;
        height: 100%;
      }
      .right-in {
        /* 假设容器内有500px的元素 */
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">header</div>
      <div class="content">
        <div class="left">导航</div>
        <div class="right">
          <div class="right-in">自适应，超出高度出现滚动条</div>
        </div>
      </div>
      <!-- <div class="footer">footer</div> -->
    </div>
  </body>
</html>
