<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>响应式布局示例</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        height: 100vh;
      }
      .header {
        background: #ececec;
        width: 100%;
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .sidebar {
        background: #f2f2f2;
        width: 200px;
        flex-grow: 0;
        flex-shrink: 0;
        height: calc(100% - 50px);
      }
      .main {
        background: #ffffff;
        flex-grow: 1;
        height: calc(100% - 50px);
        padding: 20px;
        box-sizing: border-box;
      }
      @media (max-width: 768px) {
        .sidebar {
          width: 100%;
          height: auto;
        }
        .main {
          width: 100%;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <!-- Header 内容 -->
        <h1>网站标题</h1>
      </div>
      <div class="sidebar">
        <!-- Sidebar 内容 -->
        <nav>
          <ul>
            <li>链接 1</li>
            <li>链接 2</li>
            <li>链接 3</li>
          </ul>
        </nav>
      </div>
      <div class="main">
        <!-- Main 内容 -->
        <p>这里是主要内容部分。</p>
      </div>
    </div>
  </body>
</html>
