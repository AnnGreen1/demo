<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let count = 0;
      let timer = setInterval(() => {
        count++;
        console.log(count);
        if (count === 5) {
          clearInterval(timer);
        }
      }, 1000);
    </script>
  </body>
