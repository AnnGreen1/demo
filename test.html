<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

	</head>
	<body>
	<button class="btn">shot</button>
	
	<script>
		const btn = document.querySelector('.btn')
		
		function throttle(func,delay=2000){
			let timer = null
			
			return function(...args){
				if(!timer){
					timer = setTimeout(()=>{
						func.apply(this,args)
						timer = null
					},delay)
				}
			}
		}
		
			
		function shot(){
			console.log('shot',new Date())
		}
		
		btn.addEventListener('click',throttle(shot,2000))
	</script>
	</body>
</html>
